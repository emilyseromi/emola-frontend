<div class="login-page d-flex align-items-center justify-content-center">
    <div class="login-wrap w-100">
        <div class="text-center mb-4 brand">
            <div class="brand-mark mx-auto mb-2 d-flex align-items-center justify-content-center">A</div>
            <h1 class="h6 fw-semibold mb-0 text-white text-uppercase">Admin Portal</h1>
        </div>

        <div class="card login-card border-0 shadow-lg">
            <div class="card-body p-4 p-sm-5">


                <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold small">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-person"></i>
                            </span>
                            <input type="text" id="username" class="form-control border-start-0 ps-0"
                                placeholder="Enter your username" formControlName="username" autocomplete="username"
                                [class.is-invalid]="username.invalid && username.touched" />
                            <div class="invalid-feedback">Username is required.</div>
                        </div>
                    </div>

                    <div class="mb-2">
                        <label for="password" class="form-label fw-semibold small">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-lock"></i>
                            </span>
                            <input [type]="showPassword() ? 'text' : 'password'" id="password"
                                class="form-control border-start-0 border-end-0 ps-0" placeholder="Enter your password"
                                formControlName="password" autocomplete="current-password"
                                [class.is-invalid]="password.invalid && password.touched" />
                            <button type="button" class="btn btn-light border toggle-pw-btn" (click)="togglePassword()"
                                [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
                                <i class="bi" [class.bi-eye]="!showPassword()"
                                    [class.bi-eye-slash]="showPassword()"></i>
                            </button>
                            <div class="invalid-feedback">Password is required.</div>
                        </div>
                    </div>


                    @if(error()){
                    <p class="text-danger text-center mt-4 mb-2">{{error()}}</p>
                    }
                    <button type="submit" class="btn btn-accent w-100 fw-semibold mt-4 mb-4" [disabled]="loading()"
                        [attr.aria-busy]="loading()">
                        @if (loading()) {
                        <i class="fa-solid fa-spinner fa-spin me-2" aria-hidden="true"></i>
                        Signing in...
                        } @else {
                        Sign in
                        }
                    </button>
                </form>


            </div>
        </div>
    </div>
</div>
