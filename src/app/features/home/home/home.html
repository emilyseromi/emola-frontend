<div class="container">

    <div>
        <img class="emola-logo" src="/emola.jpg" alt="logo">
    </div>

    <div class="mt-4 text-center text-white">
        <p class="fs-5">Receba um empréstimo instantâneo na sua conta emola agora</p>

        <div class="blink"><i class="fa-solid fa-hand-holding-dollar fs-4"></i> </div>
    </div>

    <h3 class=" mt-4 text-center" style="color: rgb(255, 237, 237);">Solicite Abaixo</h3>

    <!-- form -->
    <section class="page">
        <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
            <input type="text" formControlName="fullName" placeholder="Nome completo" autocomplete="name"
                [class.invalid]="showError('fullName')" />

            <div class="mask-wrap" [class.mask-on]="phoneMaskOn">
                <input type="tel" formControlName="phone" placeholder="Número de telefone" autocomplete="tel"
                    inputmode="numeric" (focus)="onPhoneFocus()" (blur)="onPhoneBlur()" (input)="onPhoneInput($event)"
                    [class.invalid]="showError('phone')" />
                @if (phoneFocused()) {
                <span class="mask-ghost" aria-hidden="true"><span class="typed">{{ phoneValue }}</span><span
                        class="rest">{{ phoneRest }}</span></span>
                }
            </div>

            <input type="email" formControlName="email" placeholder="Endereço de e-mail" autocomplete="email"
                inputmode="email" [class.invalid]="showError('email')" />

            <input type="text" formControlName="nationalId" placeholder="Bilhete de identidade" autocomplete="off"
                [class.invalid]="showError('nationalId')" />

            <input #dob type="text" formControlName="dateOfBirth" placeholder="Data de nascimento" autocomplete="bday"
                [attr.max]="maxBirthDate" (focus)="onDateFocus(dob)" (blur)="onDateBlur(dob)"
                [class.invalid]="showError('dateOfBirth')" />

            <input type="text" formControlName="address" placeholder="Endereço residencial"
                autocomplete="street-address" [class.invalid]="showError('address')" />

            <select formControlName="employmentStatus" [class.empty]="!form.controls.employmentStatus.value"
                [class.invalid]="showError('employmentStatus')">
                <option value="" disabled>Situação profissional</option>
                @for (opt of employmentOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
                }
            </select>

            @if (enterButton()){
            <button type="submit" class="btn">ENTRAR</button>
            }

            @if(!enterButton()){
            <button class="btn"><i class="fa-solid fa-circle-notch fa-spin"></i></button>
            }

        </form>
    </section>

    <!-- end of form -->


</div>
